<!doctype html>
<html lang="ne">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>मन्दिर</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #faf7f1; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 16px; text-align: center; font: 16px system-ui,sans-serif; color: #762b39; padding: 24px; }
    .spinner { width: 32px; height: 32px; margin: auto; border: 3px solid #e5d8ca; border-top-color: #762b39; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <div id="loading" role="status"><div class="spinner"></div><span id="message">वेबसाइट लोड हुँदैछ…</span></div>
  <iframe id="website" title="मन्दिर वेबसाइट" hidden allow="clipboard-write"></iframe>
  <script>
    // Keep the deployment URL in the existing config.js, never temple content here.
    const configScript = document.createElement('script');
    configScript.src = './config.js?v=' + Date.now();
    configScript.onload = function () {
      const config = window.MANDIR_CONFIG || window.APP_CONFIG || {};
      const url = config.appsScriptURL || config.appsScriptUrl || config.APP_SCRIPT_URL || config.webAppUrl || config.scriptUrl;
      if (!url || !/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:\?.*)?$/.test(url)) {
        document.getElementById('message').textContent = 'config.js मा Apps Script को /exec URL राख्नुहोस् ।';
        return;
      }
      const frame = document.getElementById('website');
      frame.onload = function () { document.getElementById('loading').remove(); };
      frame.hidden = false;
      frame.src = url.split('?')[0];
    };
    configScript.onerror = function () {
      document.getElementById('message').textContent = 'config.js भेटिएन । GitHub मा config.js पनि राख्नुहोस् ।';
    };
    document.head.appendChild(configScript);
  </script>
</body>
</html>
